name: pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Pruebas
        run: pytest -q
      - name: Fase 0 y ejemplos del Bloque A
        run: |
          python -m cpo.fase0
          python -m cpo.informe bloqueA
      - name: Compilar PDF de ejemplos (LaTeX)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: bloqueA.tex
          working_directory: docs/ejemplos
      - uses: actions/upload-artifact@v4
        with:
          name: resultados-python
          path: |
            resultados/
            docs/fase0_reporte.md
      - uses: actions/upload-artifact@v4
        with:
          name: ejemplos-bloqueA-pdf
          path: docs/ejemplos/bloqueA.pdf

  matlab:
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: resultados-python
          path: .
      - uses: matlab-actions/setup-matlab@v2
      - name: Pruebas MATLAB y cruce contra Python
        uses: matlab-actions/run-command@v2
        with:
          command: cd matlab; addpath(pwd); addpath('pruebas'); pruebas_fase0; pruebas_bloqueA; run_bloqueA
      - name: Empaquetar ejecutable MATLAB
        run: zip -r cpo_matlab.zip matlab data LICENSE README.md
      - uses: actions/upload-artifact@v4
        with:
          name: cpo-matlab
          path: cpo_matlab.zip
